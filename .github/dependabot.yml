version: 2
updates:
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
      day: monday
    labels: [terraform]
    commit-message:
      prefix: "deps(terraform)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [ci]
    commit-message:
      prefix: "deps(ci)"
