# Loaded by the grafana sidecar (label grafana_dashboard=1).
# Edit in Grafana, export JSON, paste back here. Don't hand-edit panel ids.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-podinfo-golden-signals
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: platform
data:
  podinfo-golden-signals.json: |
    {
      "title": "podinfo / golden signals",
      "uid": "podinfo-golden",
      "tags": ["platform", "podinfo"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 3,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "Prometheus" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Requests / s",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "refId": "A", "expr": "job:podinfo_http_requests:rate5m" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "decimals": 1 } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "none" }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "5xx ratio",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "refId": "A", "expr": "job:podinfo_http_error_ratio:rate5m" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.01 },
                  { "color": "red", "value": 0.05 }
                ]
              }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p95 latency",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "refId": "A", "expr": "job:podinfo_http_latency_p95:5m" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.3 },
                  { "color": "red", "value": 0.5 }
                ]
              }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Ready replicas",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_ready{namespace=\"podinfo\", deployment=\"podinfo\"}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0 } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "none" }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Traffic by status class",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (label_replace(rate(http_requests_total{job=\"podinfo\"}[5m]), \"status\", \"${1}xx\", \"status\", \"(\\\\d)..\"))",
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "fillOpacity": 15, "stacking": { "mode": "normal" } } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "5xx" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] }
            ]
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latency percentiles",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"podinfo\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"podinfo\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"podinfo\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU (cores) vs request",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"podinfo\", container=\"podinfo\"}[5m]))",
              "legendFormat": "{{pod}}"
            },
            {
              "refId": "B",
              "expr": "avg(kube_pod_container_resource_requests{namespace=\"podinfo\", container=\"podinfo\", resource=\"cpu\"})",
              "legendFormat": "request"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": [
              { "matcher": { "id": "byName", "options": "request" }, "properties": [ { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 10] } } ] }
            ]
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memory working set vs limit",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"podinfo\", container=\"podinfo\"})",
              "legendFormat": "{{pod}}"
            },
            {
              "refId": "B",
              "expr": "avg(kube_pod_container_resource_limits{namespace=\"podinfo\", container=\"podinfo\", resource=\"memory\"})",
              "legendFormat": "limit"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes" },
            "overrides": [
              { "matcher": { "id": "byName", "options": "limit" }, "properties": [ { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 10] } }, { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] }
            ]
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Restarts (30m) and HPA replicas",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"podinfo\", container=\"podinfo\"}[30m]))",
              "legendFormat": "restarts"
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"podinfo\", horizontalpodautoscaler=\"podinfo\"}",
              "legendFormat": "replicas"
            },
            {
              "refId": "C",
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"podinfo\", horizontalpodautoscaler=\"podinfo\"}",
              "legendFormat": "max"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0 } }
        }
      ]
    }
