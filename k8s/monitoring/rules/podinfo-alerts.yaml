apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: podinfo-alerts
  namespace: monitoring
  labels:
    role: alert-rules
spec:
  groups:
    - name: podinfo.recording
      interval: 30s
      rules:
        # keep the alert expressions readable by pre-aggregating here
        - record: job:podinfo_http_requests:rate5m
          expr: sum(rate(http_requests_total{job="podinfo"}[5m]))
        - record: job:podinfo_http_errors:rate5m
          expr: sum(rate(http_requests_total{job="podinfo", status=~"5.."}[5m]))
        - record: job:podinfo_http_error_ratio:rate5m
          expr: |
            job:podinfo_http_errors:rate5m
            /
            clamp_min(job:podinfo_http_requests:rate5m, 1e-9)
        - record: job:podinfo_http_latency_p95:5m
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{job="podinfo"}[5m])))

    - name: podinfo.alerts
      rules:
        - alert: PodinfoHighErrorRate
          expr: job:podinfo_http_error_ratio:rate5m > 0.05
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "podinfo 5xx ratio above 5%"
            description: "{{ $value | humanizePercentage }} of requests failing over the last 5m."
            runbook_url: https://github.com/sharikh-nayab/aks-observability-platform/blob/main/docs/runbook.md#podinfohigherrorrate

        - alert: PodinfoLatencyP95High
          expr: job:podinfo_http_latency_p95:5m > 0.5
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "podinfo p95 latency above 500ms"
            description: "p95 is {{ $value | humanizeDuration }} for 10m."
            runbook_url: https://github.com/sharikh-nayab/aks-observability-platform/blob/main/docs/runbook.md#podinfolatencyp95high

        - alert: PodinfoPodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="podinfo", container="podinfo"}[30m]) > 3
          for: 0m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "podinfo pod {{ $labels.pod }} restarted >3 times in 30m"
            runbook_url: https://github.com/sharikh-nayab/aks-observability-platform/blob/main/docs/runbook.md#podinfopodrestarting

        - alert: PodinfoNoTraffic
          expr: job:podinfo_http_requests:rate5m == 0
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "podinfo receiving zero requests"
            description: "Either nothing is calling it or ingress/service routing is broken. Check the latter first."

        - alert: PodinfoHPAAtMax
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="podinfo", horizontalpodautoscaler="podinfo"}
              >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="podinfo", horizontalpodautoscaler="podinfo"}
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "podinfo HPA pinned at maxReplicas for 15m"
            description: "Scaling headroom is gone. Raise maxReplicas or look at what's eating CPU."

    - name: platform.alerts
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "node {{ $labels.node }} NotReady for 5m"
            runbook_url: https://github.com/sharikh-nayab/aks-observability-platform/blob/main/docs/runbook.md#nodenotready

        - alert: PersistentVolumeFillingUp
          expr: |
            kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
            and predict_linear(kubelet_volume_stats_available_bytes[6h], 24 * 3600) < 0
          for: 30m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} <15% free and trending to full in 24h"

        - alert: PrometheusTargetDown
          expr: up{job=~"podinfo|kube-state-metrics|node-exporter"} == 0
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "scrape target {{ $labels.job }} ({{ $labels.instance }}) down 10m"
